name: "HELLO ACTIONS"

# This is the event that will trigger the workflow
on:
   push:
       branches: [main]
       paths-ignore:
          - "README.md"

# This is the job that the bot will run
jobs:
    say-hello:
       runs-on: ubuntu-latest
       steps:
           - name: say hello
             run: echo "Hello from GitHub Actions!"

           - name: Look at the folder before checkout
             run: ls -la

           - name: Get the code 
             uses: actions/checkout@v5
     
           - name: Look at the folder after checkout
             run: ls -la

           - name: Get facts about the run
             run: |
                echo "### Run Facts " >> $GITHUB_STEP_SUMMARY
                echo "Repository ${{ github.repository }}" >> $GITHUB_STEP-SUMMARY
                echo "Branch: ${{ github.ref_name  }}" >> $GITHUB_STEP_SUMMARY
                echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
                echo "Started by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

           - name: Get facts about the machine
             run: |
                 uname -a >> $GITHUB_STEP_SUMMARY
                 python3 --version >> $GITHUB_STEP_SUMMARY
                 pip3 --version >> $GITHUB_STEP_SUMMARY
                 docker --version >> $GITHUB_STEP_SUMMARY

           - name: Force a Failure
             run: exit 1
             